services:
  - type: web
    name: sign-language-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "/app"
    resources:
      cpu: 0.1
      memory: 512MB
      disk: 1GB 